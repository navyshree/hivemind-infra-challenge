version: "2"

run:
  timeout: 5m

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    - bodyclose    # HTTP response bodies must be closed
    - errorlint    # error comparisons must survive wrapping
    - gosec        # security-focused static analysis
    - noctx        # outbound requests must carry a context
    - revive       # style and correctness
    - unconvert    # redundant type conversions
    - usestdlibvars # use net/http constants over string literals

  settings:
    revive:
      rules:
        - name: exported
          severity: warning

  exclusions:
    rules:
      # Test files legitimately ignore errors on helper calls.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
