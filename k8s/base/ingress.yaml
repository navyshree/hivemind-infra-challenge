apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind-greeter
  namespace: hivemind-greeter
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing

    # Route straight to pod IPs rather than through a node port. This is what
    # pod readiness gates require, and it removes the extra kube-proxy hop.
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"

    # Deregistration delay must fit inside terminationGracePeriodSeconds so the
    # ALB finishes draining before the kubelet kills the container.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=20

    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http.drop_invalid_header_fields.enabled=true

    alb.ingress.kubernetes.io/tags: Project=hivemind-greeter,ManagedBy=kubernetes

    # ---- TLS lives in the overlay, not here ---------------------------------
    # The base stays HTTP-only so it is deployable with no certificate at all.
    # HTTPS is added by k8s/overlays/tls, which CD renders whenever
    # ACM_CERTIFICATE_ARN is set.
    #
    # Applying this base to a cluster that currently has the overlay REMOVES the
    # 443 listener, and the controller then closes 443 in the security group —
    # HTTPS begins hanging on the TCP handshake with no error logged anywhere.
    # That is not hypothetical; it happened before CD learned to branch.
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hivemind-greeter
                port:
                  name: http
