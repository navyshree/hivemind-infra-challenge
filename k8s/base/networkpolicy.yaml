# Default deny. Anything not explicitly permitted below is dropped, so a new
# workload added to this namespace starts closed rather than open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hivemind-greeter
  labels:
    app.kubernetes.io/name: hivemind-greeter
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hivemind-greeter
  namespace: hivemind-greeter
  labels:
    app.kubernetes.io/name: hivemind-greeter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hivemind-greeter

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Only the load balancer may reach the service.
    #
    # These are the public subnets, where the ALB's ENIs live. Pods and nodes
    # sit in the private subnets (10.0.128.0/20 and up), so listing the public
    # ranges admits the ALB while leaving pod-to-pod traffic denied. Allowing
    # the whole VPC CIDR would be simpler and would defeat the point, since
    # every pod also holds a VPC address under the VPC CNI.
    #
    # This must stay in step with local.public_subnets in terraform/main.tf,
    # which is cidrsubnet(var.vpc_cidr, 4, 0..az_count-1) — so /20s at indices
    # 0..3 for the supported az_count range of 2..4.
    #
    # A single /18 covers indices 0..3 (10.0.0.0 - 10.0.63.255) and still stops
    # short of the private subnets, which begin at index 8 (10.0.128.0).
    # Listing the three /20s individually would have been more explicit and
    # would silently stop admitting the ALB the moment az_count became 4 — a
    # supported value.
    #
    # The remaining coupling is to var.vpc_cidr itself. scripts/check-cidrs.py
    # recomputes this from the Terraform variables and fails CI on divergence,
    # so this is a checked claim rather than a comment asking to be believed.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/18
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # DNS only. The greeter makes no outbound calls of its own; this exists so
    # that cluster DNS resolution keeps working for anything the runtime does
    # implicitly, and so the failure mode is a clear DNS error rather than a
    # silent hang if that ever changes.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
