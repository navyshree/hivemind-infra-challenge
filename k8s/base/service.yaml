apiVersion: v1
kind: Service
metadata:
  name: hivemind-greeter
  namespace: hivemind-greeter
  labels:
    app.kubernetes.io/name: hivemind-greeter
spec:
  # ClusterIP, not LoadBalancer: the ALB is provisioned by the Ingress below,
  # which supports HTTP routing, WAF and ACM. A Service of type LoadBalancer
  # would create a second, redundant layer-4 balancer.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hivemind-greeter
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hivemind-greeter
  namespace: hivemind-greeter
  labels:
    app.kubernetes.io/name: hivemind-greeter
# No IAM role attached: the greeter calls no AWS APIs. Add an
# eks.amazonaws.com/role-arn annotation here if that ever changes.
automountServiceAccountToken: false
