apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TLS overlay — adds an HTTPS listener to the base.
#
# The base is HTTP-only so it stays deployable without a certificate. This
# overlay is what CD actually renders whenever ACM_CERTIFICATE_ARN is set; the
# ARN is substituted at apply time because it embeds the AWS account id and so
# does not belong in a committed file:
#
#   ARN=$(scripts/tls-selfsigned.sh)        # or a public ACM certificate
#   kubectl kustomize k8s/overlays/tls | sed "s|REPLACE-ME|${ARN}|" | kubectl apply -f -
#
# Applying the base instead of this overlay REMOVES the 443 listener, and the
# controller then closes 443 in the security group — so HTTPS starts hanging on
# the TCP handshake with no error anywhere. CD branches on the variable for
# exactly that reason.
#
# There is deliberately no ssl-redirect while the certificate is self-signed;
# see ingress-tls.yaml.

resources:
  - ../../base

patches:
  - path: ingress-tls.yaml
    target:
      kind: Ingress
      name: hivemind-greeter
